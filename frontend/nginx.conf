server {
    listen 80;
    server_name ops.atvos.io;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás del nginx del host, este no sabe que el pedido vino por HTTPS: al redirigir
    # /privacidad a /privacidad/ armaba un Location absoluto en http:// y la cadena pasaba
    # por texto plano. Relativo, el navegador conserva el esquema con el que entró.
    absolute_redirect off;
    port_in_redirect off;

    # Fotos de integrantes hasta 8MB + overhead multipart.
    client_max_body_size 16m;

    # El bundle son 733 KB de JS y 176 KB de CSS. Sin esto viajaban enteros en cada
    # carga y para cada persona; comprimidos son cerca de una quinta parte. `gzip_static`
    # usa los .gz que deja el build, y `gzip on` cubre lo que no se precomprimió.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Los archivos de /assets/ llevan el hash del contenido en el nombre: si cambian,
    # cambia el nombre. Entonces se pueden guardar para siempre, y una segunda visita no
    # vuelve a pedirlos ni para preguntar si cambiaron. El index.html queda afuera a
    # propósito —es el que dice qué hash hay que pedir— y ya tiene su no-cache abajo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Los audios de las llamadas del setter: una hora pesa unos 30 MB.
        client_max_body_size 200m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000;
    }
}
