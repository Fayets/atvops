server {
    listen 80;
    server_name ops.atvos.io;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás del nginx del host, este no sabe que el pedido vino por HTTPS: al redirigir
    # /privacidad a /privacidad/ armaba un Location absoluto en http:// y la cadena pasaba
    # por texto plano. Relativo, el navegador conserva el esquema con el que entró.
    absolute_redirect off;
    port_in_redirect off;

    # Fotos de integrantes hasta 8MB + overhead multipart.
    client_max_body_size 16m;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 16m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000;
    }
}
