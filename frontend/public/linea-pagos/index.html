<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Línea de pagos ATV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ventana 01/05/2026 al día de hoy. Arriba, barras horizontales de vigencia por grupo (A verde, B naranja, C azul; D y E con marca violeta); abajo, carriles de ingresos, pagos y vencimientos. Panel lateral con resumen y ficha con notas. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --fg:#131821; --muted:#5a6575; --line:#d8dee6; --lane:#e9edf2; --tint:#dfe9f7; --est:#c9d1dc;
  --accent:#d42a2a; --warn:#b26a00; --ok:#12805c;
  --g-act:#0a9a6a; --g-ven:#e8650a; --g-azul:#3d7be0; --g-vio:#7c3aed; --g-gris:#8591a1;
  --c-boost:#2f6bdb; --c-mentoria:#12907c; --c-entry:#8a52d6; --c-mid:#c98a0b; --c-advantage:#6b7787;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow:0 6px 24px rgba(15,24,40,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#161c25; --fg:#e8ecf2; --muted:#93a0b2; --line:#2a3340; --lane:#121820; --tint:#16263d; --est:#243040;
  --accent:#ff5a5a; --warn:#f0b04a; --ok:#47d1a0;
  --c-boost:#6b9bff; --c-mentoria:#3ccfb4; --c-entry:#b894ff; --c-mid:#f0b84a; --c-advantage:#9aa7b8;
  --g-act:#34d399; --g-ven:#ff9a3d; --g-azul:#6aa3ff; --g-vio:#b794ff; --g-gris:#8f9cae;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#161c25; --fg:#e8ecf2; --muted:#93a0b2; --line:#2a3340; --lane:#121820; --tint:#16263d; --est:#243040;
  --accent:#ff5a5a; --warn:#f0b04a; --ok:#47d1a0;
  --c-boost:#6b9bff; --c-mentoria:#3ccfb4; --c-entry:#b894ff; --c-mid:#f0b84a; --c-advantage:#9aa7b8;
  --g-act:#34d399; --g-ven:#ff9a3d; --g-azul:#6aa3ff; --g-vio:#b794ff; --g-gris:#8f9cae;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,.stage:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;gap:10px}
header{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-size:22px;line-height:1.1;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.glabel{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;line-height:1.4}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through;text-decoration-color:transparent}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px;font-size:12.5px}
.btn:hover{border-color:var(--muted)}
main{display:flex;flex-direction:column;gap:12px}
.stage{position:relative;flex:none;height:calc(100vh - 175px);min-height:460px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
.stage.drag{cursor:grabbing}
svg{display:block;width:100%;height:100%}
svg text{font-family:var(--f-body)}
.mono{font-family:var(--f-mono)}
.hint{position:absolute;left:10px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:5px 9px;max-width:calc(100% - 20px);pointer-events:none}
.hint i{display:inline-block;vertical-align:-2px;margin-right:4px}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12.5px;max-width:270px;display:none}
.tip b{font-family:var(--f-display);font-size:14px}
.tip .r{color:var(--muted);font-size:12px}
.panel{min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:9px 6px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane[hidden]{display:none}
.pane{padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px 22px;align-items:start}
.pane .full{grid-column:1/-1}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
#goF{position:absolute;right:10px;top:10px;z-index:4}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f input,label.f select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pane>section,.pane>details{min-width:0}
h2{font-family:var(--f-display);font-size:15px;margin:0 0 6px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kpi .v{font-family:var(--f-display);font-size:24px;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:11px}
td{font-family:var(--f-mono)}
td:first-child{font-family:var(--f-body)}
.tw{overflow-x:auto}
tr.dim{opacity:.35}
details{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
summary{cursor:pointer;font-weight:500}
.names{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.nm{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 7px;font-size:12px;display:inline-flex;gap:5px;align-items:center}
.nm .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.nm:hover{border-color:var(--muted)}
.gl{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:8px 0 2px;width:100%}
.note{font-size:12.5px;color:var(--muted)}
.warn{color:var(--warn);font-size:12.5px}
.row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:13px}
.row span:first-child{color:var(--muted)}
.row span:last-child{font-family:var(--f-mono);text-align:right}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;border:1px solid var(--c,var(--line));color:var(--c,var(--fg))}
.bar{height:7px;background:var(--lane);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
textarea,input[type=search]{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{resize:vertical;min-height:64px}
.nl{display:flex;flex-direction:column;gap:8px}
.ni{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.ni .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.ni p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;margin-top:6px}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.clist{display:flex;flex-direction:column;max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.clist button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:5px 9px}
.clist button:last-child{border-bottom:0}
.clist button:hover{background:var(--lane)}
.clist .d{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
@media (max-width:860px){
  .stage{height:70vh;min-height:420px}
  .pane{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header>
    <div>
      <h1>Línea de pagos ATV</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="tools">
      <div class="grp" id="gPlan"><span class="glabel">Programa</span></div>
      <div class="grp" id="gGr"><span class="glabel">Grupo</span></div>
      <div class="grp" id="gMk"><span class="glabel">Marcas</span></div>
      <div class="grp" id="gLane"><span class="glabel">Carriles</span></div>
      <div class="grp" id="gZoom">
        <button class="btn" id="zOut" aria-label="Alejar">−</button>
        <button class="btn" id="zIn" aria-label="Acercar">+</button>
        <button class="btn" id="vJun">Ventana</button>
        <button class="btn" id="vNow">Hoy</button>
      </div>
    </div>
  </header>
  <main>
    <div class="stage" id="stage" tabindex="0" aria-label="Línea de tiempo de ingresos, pagos y vencimientos. Arrastrá para mover, rueda para hacer zoom.">
      <svg id="svg" role="img" aria-label="Línea de tiempo">
        <defs>
          <pattern id="pAB" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="var(--g-act)"/><rect x="4" width="4" height="8" fill="var(--g-ven)"/></pattern>
          <pattern id="pPa" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="2" height="6" fill="#fff" opacity=".55"/></pattern>
          <pattern id="pOt" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="var(--g-gris)" opacity=".35"/></pattern>
        </defs>
        <g id="gBg"></g><g id="gWorld"></g><g id="gFg"></g>
      </svg>
      <div class="tip" id="tip"></div>
      <button class="btn pri" id="goF" hidden type="button"></button>
      <div class="hint">
        <span>Arrastrar: mover · Rueda o pellizco: zoom · Clic en una barra o punto: ficha y notas</span>
        <span><i style="width:16px;height:8px;background:var(--g-act);display:inline-block;border-radius:2px"></i>A · Discord, vigente</span>
        <span><i style="width:16px;height:8px;background:var(--g-ven);display:inline-block;border-radius:2px"></i>B · vencido</span>
        <span><i style="width:16px;height:8px;background:repeating-linear-gradient(45deg,var(--g-act) 0 3px,var(--g-ven) 3px 6px);display:inline-block;border-radius:2px"></i>A y B</span>
        <span><i style="width:16px;height:8px;background:var(--g-azul);display:inline-block;border-radius:2px"></i>C · salió por vencimiento</span>
        <span><i style="width:16px;height:8px;border:2px solid var(--g-vio);display:inline-block;border-radius:2px;box-sizing:border-box"></i>D · inconsistencia</span>
        <span><i style="width:16px;height:8px;border:2px dashed var(--g-vio);display:inline-block;border-radius:2px;box-sizing:border-box"></i>E · cuota sin pagar (proxy)</span>
        <span><i style="width:16px;height:8px;background:var(--g-gris);display:inline-block;border-radius:2px"></i>Seña o sin grupo</span>
        </div>
    </div>
    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabRes" aria-selected="true">Resumen</button>
        <button class="tab" role="tab" id="tabCli" aria-selected="false">Cliente, ajustes y notas</button>
        <button class="tab" role="tab" id="tabAj" aria-selected="false">Ajustes cargados</button>
      </div>
      <div class="pane" id="paneRes"></div>
      <div class="pane" id="paneCli" hidden></div>
      <div class="pane" id="paneAj" hidden></div>
    </aside>
  </main>
</div>

<script>
/* Trae los datos en vivo de ATV Ops y monta la línea. Las notas y los ajustes se guardan en
   la base de Ops con la misma interfaz que usaba el artifact original (window.claude.use('db')). */
(function () {
  const token = localStorage.getItem('atv-ops-token');
  const pedir = (ruta, op) => fetch('/api/linea-pagos' + ruta, Object.assign({}, op, {
    headers: Object.assign({ Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, (op || {}).headers),
  })).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.status === 204 ? null : r.json(); });

  function coleccion(nombre) {
    const oyentes = [];
    const avisar = () => pedir('/' + nombre).then((docs) => {
      const snap = { docs: docs.map((d) => ({ id: d.id, data: () => d.data })) };
      oyentes.forEach(([ok]) => ok(snap));
    }).catch((e) => oyentes.forEach(([, mal]) => mal && mal(e)));
    return {
      doc: (id) => ({
        set: (data) => pedir('/' + nombre + '/' + encodeURIComponent(id), { method: 'PUT', body: JSON.stringify(data) }).then(avisar),
        delete: () => pedir('/' + nombre + '/' + encodeURIComponent(id), { method: 'DELETE' }).then(avisar),
      }),
      onSnapshot(ok, mal) {
        oyentes.push([ok, mal]);
        avisar();
        // Lo que cargó otra persona aparece solo, sin recargar.
        setInterval(avisar, 30000);
        return () => {};
      },
    };
  }
  const colecciones = {};
  window.claude = { use: async (que) => (que === 'db' ? { collection: (n) => (colecciones[n] ||= coleccion(n)) } : null) };

  pedir('').then((data) => {
    window.LINEA_DATA = data;
    const s = document.createElement('script');
    s.src = 'app.js';
    document.body.appendChild(s);
  }).catch((e) => {
    document.body.innerHTML = '<p style="font:14px system-ui;padding:24px">No se pudo cargar la línea de pagos: ' + e.message + '</p>';
  });
})();
</script>

</body></html>
