services:
  backend:
    build: ./backend
    container_name: atv-ops-backend
    restart: always
    ports:
      - "8012:8000"
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      # El bot de ATV Clients escribe acá; ATV Ops solo lee.
      TRANSCRIPTS_BASE_PATH: /opt/atv-clients/transcripts
      # El cerebro (notas markdown) vive en el volumen data; rclone lo sube a Google Drive.
      CEREBRO_DIR: /app/data/cerebro
    volumes:
      - /opt/atv-clients/transcripts:/opt/atv-clients/transcripts:ro
      - /opt/atv-ops/data:/app/data
      # La sesión del CLI de Claude. Sin esto hay que pegar un token en el .env en cada
      # rebuild, y un token pegado a mano se corrompe en el camino: perdimos una tarde
      # con uno que llegaba con caracteres no-ASCII desde el portapapeles. Con la sesión
      # en un volumen, `claude /login` se hace una vez y sobrevive a los deploys.
      - /opt/atv-ops/claude-home:/root/.claude

  frontend:
    build:
      context: ./frontend
      args:
        # El frontend habla con /api por el mismo origen (nginx del host).
        - VITE_API_URL=
    container_name: atv-ops-frontend
    restart: always
    ports:
      - "8092:80"
    depends_on:
      - backend
